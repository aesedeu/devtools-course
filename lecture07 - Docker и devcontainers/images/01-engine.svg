<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="348" viewBox="0 0 1100 348" role="img" aria-labelledby="title desc">
<title id="title">Клиент и демон на ВМ</title><desc id="desc">Клиент docker обращается к демону dockerd на удалённой ВМ. Демон управляет запуском контейнера.</desc>
<rect width="1100" height="348" fill="#FFFFFF"/>
<g font-family="Inter, DejaVu Sans, Arial, sans-serif">
<rect x="24" y="24" width="1052" height="300" rx="14" fill="#F8F9FC" stroke="#BBC9DA" stroke-width="1.5"/><text x="56" y="67" text-anchor="start" font-size="24" font-weight="600" fill="#19334D">Удалённая ВМ · Linux</text><rect x="64" y="134" width="230" height="114" rx="14" fill="#FFFFFF" stroke="#BBC9DA" stroke-width="1.5"/><text x="179.0" y="182.0" text-anchor="middle" font-size="24" font-weight="400" fill="#19334D">Клиент</text><text x="179.0" y="216.0" text-anchor="middle" font-size="24" font-weight="400" fill="#19334D">docker</text><rect x="432" y="134" width="230" height="114" rx="14" fill="#E5EFFE" stroke="#BBC9DA" stroke-width="1.5"/><text x="547.0" y="182.0" text-anchor="middle" font-size="24" font-weight="400" fill="#19334D">Демон</text><text x="547.0" y="216.0" text-anchor="middle" font-size="24" font-weight="400" fill="#19334D">dockerd</text><rect x="800" y="134" width="230" height="114" rx="14" fill="#FFFFFF" stroke="#BBC9DA" stroke-width="1.5"/><text x="915.0" y="182.0" text-anchor="middle" font-size="21" font-weight="400" fill="#19334D">Контейнер</text><text x="915.0" y="216.0" text-anchor="middle" font-size="21" font-weight="400" fill="#19334D">процесс приложения</text><path d="M294 191 L420 191 M412 186 L420 191 L412 196" fill="none" stroke="#1667F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M662 191 L788 191 M780 186 L788 191 L780 196" fill="none" stroke="#1667F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="358" y="167" text-anchor="middle" font-size="19" font-weight="400" fill="#4D6785">запрос</text><text x="726" y="167" text-anchor="middle" font-size="19" font-weight="400" fill="#4D6785">запуск</text>
