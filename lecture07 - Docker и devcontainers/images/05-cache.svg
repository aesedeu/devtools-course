<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="476" viewBox="0 0 1100 476" role="img" aria-labelledby="title desc">
<title id="title">Кэш при изменении кода и зависимостей</title><desc id="desc">При неизменном базовом образе изменение только app.py сохраняет кэш установки зависимостей. Изменение requirements.txt требует выполнить соответствующий шаг и последующие.</desc>
<rect width="1100" height="476" fill="#FFFFFF"/>
<g font-family="Inter, DejaVu Sans, Arial, sans-serif">
<text x="224" y="50" text-anchor="middle" font-size="23" font-weight="600" fill="#19334D">Шаг сборки</text><text x="590" y="40" text-anchor="middle" font-size="21" font-weight="400" fill="#4D6785">Изменён</text><text x="590" y="69" text-anchor="middle" font-size="23" font-weight="600" fill="#19334D">app.py</text><text x="916" y="40" text-anchor="middle" font-size="21" font-weight="400" fill="#4D6785">Изменён</text><text x="916" y="69" text-anchor="middle" font-size="23" font-weight="600" fill="#19334D">requirements.txt</text><rect x="28" y="104" width="392" height="68" rx="14" fill="#F8F9FC" stroke="#BBC9DA" stroke-width="1.5"/><text x="224.0" y="146.0" text-anchor="middle" font-size="22" font-weight="400" fill="#19334D">Базовый образ</text><rect x="452" y="104" width="294" height="68" rx="14" fill="#E5EFFE"/><text x="599" y="147" text-anchor="middle" font-size="22" font-weight="400" fill="#19334D">Без изменения</text><rect x="778" y="104" width="294" height="68" rx="14" fill="#E5EFFE"/><text x="925" y="147" text-anchor="middle" font-size="22" font-weight="400" fill="#19334D">Без изменения</text><path d="M224 172 L224 190 M229 182 L224 190 L219 182" fill="none" stroke="#1667F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="28" y="196" width="392" height="68" rx="14" fill="#F8F9FC" stroke="#BBC9DA" stroke-width="1.5"/><text x="224.0" y="238.0" text-anchor="middle" font-size="22" font-weight="400" fill="#19334D">COPY requirements.txt</text><rect x="452" y="196" width="294" height="68" rx="14" fill="#E5EFFE"/><text x="599" y="239" text-anchor="middle" font-size="22" font-weight="400" fill="#19334D">CACHED</text><rect x="778" y="196" width="294" height="68" rx="14" fill="#1667F5"/><text x="925" y="239" text-anchor="middle" font-size="22" font-weight="400" fill="#FFFFFF">Выполнить</text><path d="M224 264 L224 282 M229 274 L224 282 L219 274" fill="none" stroke="#1667F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="28" y="288" width="392" height="68" rx="14" fill="#F8F9FC" stroke="#BBC9DA" stroke-width="1.5"/><text x="224.0" y="330.0" text-anchor="middle" font-size="22" font-weight="400" fill="#19334D">RUN pip install …</text><rect x="452" y="288" width="294" height="68" rx="14" fill="#E5EFFE"/><text x="599" y="331" text-anchor="middle" font-size="22" font-weight="400" fill="#19334D">CACHED</text><rect x="778" y="288" width="294" height="68" rx="14" fill="#1667F5"/><text x="925" y="331" text-anchor="middle" font-size="22" font-weight="400" fill="#FFFFFF">Выполнить</text><path d="M224 356 L224 374 M229 366 L224 374 L219 366" fill="none" stroke="#1667F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="28" y="380" width="392" height="68" rx="14" fill="#F8F9FC" stroke="#BBC9DA" stroke-width="1.5"/><text x="224.0" y="422.0" text-anchor="middle" font-size="22" font-weight="400" fill="#19334D">COPY app.py</text><rect x="452" y="380" width="294" height="68" rx="14" fill="#1667F5"/><text x="599" y="423" text-anchor="middle" font-size="22" font-weight="400" fill="#FFFFFF">Выполнить</text><rect x="778" y="380" width="294" height="68" rx="14" fill="#1667F5"/><text x="925" y="423" text-anchor="middle" font-size="22" font-weight="400" fill="#FFFFFF">Выполнить</text>
</g></svg>
